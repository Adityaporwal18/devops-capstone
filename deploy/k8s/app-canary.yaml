apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventhub-canary
  labels:
    app: eventhub
    track: canary
spec:
  replicas: 0
  selector:
    matchLabels:
      app: eventhub
      track: canary
  template:
    metadata:
      labels:
        app: eventhub
        track: canary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: eventhub
          image: adityaporwal18/eventhub:139f0d6
          ports:
            - containerPort: 8000
          env:
            - name: TRACK
              value: canary
            - name: SEED_DEMO
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: eventhub-db
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
