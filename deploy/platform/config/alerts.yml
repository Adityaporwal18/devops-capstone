groups:
  - name: eventhub
    rules:
      - alert: EventHubHighErrorRate
        expr: |
          sum by (track) (rate(eventhub_http_requests_total{status=~"5.."}[1m]))
            / sum by (track) (rate(eventhub_http_requests_total{route=~"/api/.*"}[1m])) > 0.05
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "More than 5% of API requests on track {{ $labels.track }} fail"
      - alert: EventHubInstanceDown
        expr: up{job="eventhub"} == 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "EventHub pod {{ $labels.pod }} cannot be scraped"
      - alert: EventHubDatabaseDown
        expr: min(eventhub_database_up) == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "EventHub cannot reach its database"
