apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - prometheus.yaml
  - grafana.yaml
  - loki.yaml
  - promtail.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: prometheus-config
    namespace: monitoring
    files:
      - config/prometheus.yml
      - config/alerts.yml
  - name: grafana-provisioning
    namespace: monitoring
    files:
      - config/grafana-datasources.yaml
      - config/grafana-dashboard-provider.yaml
  - name: grafana-dashboards
    namespace: monitoring
    files:
      - config/eventhub-dashboard.json
  - name: loki-config
    namespace: monitoring
    files:
      - config/loki.yaml
  - name: promtail-config
    namespace: monitoring
    files:
      - config/promtail.yaml
