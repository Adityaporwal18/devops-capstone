name: eventhub
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: eventhub
      POSTGRES_DB: eventhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventhub -d eventhub"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      target: runtime
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-local}
    image: eventhub:${APP_VERSION:-dev}
    environment:
      DATABASE_URL: postgresql://eventhub:${POSTGRES_PASSWORD}@db:5432/eventhub
      SEED_DEMO: "true"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  db-data:
